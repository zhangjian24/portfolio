              - strong [ref=e226]: 出站问题
              - text: ：vast.ai 的 agent 需要访问外网 API 进行注册、心跳、拉取容器镜像等操作。国内服务器直接访问会被阻断。
            - paragraph [ref=e227]:
              - strong [ref=e228]: 入站问题
              - text: ：vast.ai 的计费模型是：租户通过 SSH 连接到你的 GPU 服务器上的容器。如果服务器没有公网 IP，租户连不进来，平台就不会让你上线。
