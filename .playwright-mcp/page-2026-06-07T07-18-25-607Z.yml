              - strong [ref=e404]: 一句话原理
              - text: ：frpc（客户端）主动连接 frps（服务端），建立一条长连接 TCP 隧道。外部请求到达 frps 后，通过这条隧道转发到内网。
            - figure [ref=e406]:
              - code [ref=e408]:
                - generic [ref=e409]:
                  - generic [ref=e410]:
                    - generic: "1"
                  - generic [ref=e411]: 外网请求 → frps(公网:40000) → [TLS 隧道] → frpc(内网) → localhost:40000
              - button "Copy to clipboard" [ref=e413] [cursor=pointer]
            - paragraph [ref=e415]:
              - text: frpc 是
              - strong [ref=e416]: 主动方
              - text: ，所以内网机器不需要公网 IP 也能暴露端口。
            - paragraph [ref=e417]:
              - strong [ref=e418]: 为什么选 FRP 而不是 WireGuard？
              - text: WireGuard 是三层 VPN，虚拟网卡会暴露 GPU 服务器的整个网络，安全风险高。FRP 是四层端口代理，粒度精确到单个端口。vast.ai 的模型是
              - strong [ref=e419]: 每个租户一个独立端口
              - text: （40000-40100），FRP 天然匹配。而且 FRP 的 TLS 加密不影响租户的 SSH 密钥认证流程。
            - heading "4.2 Shadowsocks——出站流量不被识别为代理" [level=3] [ref=e420]
            - paragraph [ref=e421]:
              - strong [ref=e422]: 一句话原理
              - text: ：数据用 AEAD 算法（aes-256-gcm）加密后发送，外形和随机数据无异，不会被 DPI 设备识别为代理流量。
            - table [ref=e423]:
              - rowgroup [ref=e424]:
                - row "层 组件" [ref=e425]:
                  - columnheader "层" [ref=e426]
                  - columnheader "组件" [ref=e427]
              - rowgroup [ref=e428]:
                - row "应用层 用户数据（HTTP/HTTPS/任意）" [ref=e429]:
                  - cell "应用层" [ref=e430]
                  - cell "用户数据（HTTP/HTTPS/任意）" [ref=e431]
                - row "加密层 AEAD，每个包独立 IV，无协议特征" [ref=e432]:
                  - cell "加密层" [ref=e433]
                  - cell "AEAD，每个包独立 IV，无协议特征" [ref=e434]
                - row "传输层 TCP/UDP，Shadowsocks 协议封装" [ref=e435]:
                  - cell "传输层" [ref=e436]
                  - cell "TCP/UDP，Shadowsocks 协议封装" [ref=e437]
            - paragraph [ref=e438]:
              - strong [ref=e439]: 为什么选 SS 不选 V2Ray？
              - text: V2Ray 功能多但配置复杂。SS 服务端只需一个
              - code [ref=e440]: listeners
              - text: 块，一行
              - code [ref=e441]: password
              - text: 一行
              - code [ref=e442]: cipher
              - text: ，维护成本最低。在这个场景里，GPU 只做一件事——出站访问，SS 足够且最稳定。
            - heading "4.3 TUN 透明代理——Docker 容器也走代理" [level=3] [ref=e443]
            - paragraph [ref=e444]:
              - strong [ref=e445]: 一句话原理
              - text: ：Mihomo 在系统创建一个 TUN 虚拟网卡，所有 IP 层流量（无论来自哪个进程、哪个 Docker 容器）都被送入这个虚拟网卡，由 Mihomo 做代理决策。
