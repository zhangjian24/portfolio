                  - cell "高评分 + 低延迟 + 高带宽" [ref=e1078]
            - paragraph [ref=e1079]:
              - text: 查看同型号卡的当前市场价：
              - link "https://vast.ai/pricing" [ref=e1080] [cursor=pointer]:
                - /url: https://vast.ai/pricing
            - paragraph [ref=e1081]:
              - strong [ref=e1082]: 建议
              - text: ：第一个月设低于均价 10-15%，快速拉高评分和运行时长。vast.ai 的搜索排名算法会优先展示评分高、在线率高的 Host。
            - heading "6.3 Self-test——自己先租一次" [level=3] [ref=e1083]
