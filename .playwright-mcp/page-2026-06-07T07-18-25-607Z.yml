            - heading "4.4 Docker daemon 代理——镜像拉取的最后一公里" [level=3] [ref=e549]
            - paragraph [ref=e550]: 虽然 TUN 已经能接管 Docker 容器流量，但 Docker daemon 本身的网络行为（拉取镜像）走的是宿主机网络栈，不经过 TUN。因此需要额外配置：
