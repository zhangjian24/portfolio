            - heading "六、上线运营——怎样让机器租出去" [level=2] [ref=e1045]
            - paragraph [ref=e1046]: 部署上线只是第一步。以下是从实操中总结的运营要点。
            - heading "6.1 创建 Offer" [level=3] [ref=e1047]
            - paragraph [ref=e1048]: 登录 vast.ai Host 控制台：
            - list [ref=e1049]:
              - listitem [ref=e1050]: 确认 GPU 出现在 Machines 列表
              - listitem [ref=e1051]: 点击 Create Offer → 选择 Verification Level
              - listitem [ref=e1052]:
                - strong [ref=e1053]: 建议从 Intermittent 起步
                - text: ——审核门槛低，上线快
              - listitem [ref=e1054]: 机器稳定后可以升级到 Verified（更高优先级）
            - heading "6.2 定价策略" [level=3] [ref=e1055]
            - paragraph [ref=e1056]: vast.ai 是纯市场定价，Host 自己设时薪：
