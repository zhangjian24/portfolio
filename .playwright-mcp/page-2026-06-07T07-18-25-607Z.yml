            - heading "七、FAQ" [level=2] [ref=e1117]
            - heading "Q1：一张卡能稳定赚多少？" [level=3] [ref=e1118]
            - paragraph [ref=e1119]: 取决于利用率和电费。RTX 4090 稳态月净利约 ¥350-600。首月偏低（30-40%），3 个月后进入稳态。
            - heading "Q2：中继服务器需要什么配置？" [level=3] [ref=e1120]
            - paragraph [ref=e1121]: 1C1G 足够，带宽建议 100Mbps+。搬瓦工或同类便宜 VPS 即可，¥30-70/月。一台中继可带 1-2 台 GPU 服务器。
            - heading "Q3：TUN 透明代理会不会影响我正常使用？" [level=3] [ref=e1122]
            - paragraph [ref=e1123]:
              - text: TUN 接管所有流量，但
              - strong [ref=e1124]: 不会降低国内访问速度
              - text: ——中继 IP 和所有内网段都配了直连规则，只有出站流量才走代理。
            - heading "Q4：机器掉线了怎么办？" [level=3] [ref=e1125]
            - paragraph [ref=e1126]:
              - text: SSH 连进去，重新跑
              - code [ref=e1127]: bash setup-client.sh all
              - text: 。脚本幂等，不影响已经跑着的任务。
            - heading "Q5：vast.ai 怎么提现？" [level=3] [ref=e1128]
            - paragraph [ref=e1129]: 支持加密货币（Coinbase、Crypto.com）和银行转账。最低 $5 起提，无手续费。
            - heading "Q6：国内电费这么高，还值得吗？" [level=3] [ref=e1130]
            - paragraph [ref=e1131]: 按 ¥0.8/kWh 算，RTX 4090 月净利 ~¥380。减去中继 VPS ¥50，净剩 ~¥330。一年约 ¥4000，大约覆盖卡价的 25%。如果卡已经在手用来跑自己的训练，那出租空余时间就是纯增量收入。
            - separator [ref=e1132]
            - heading "八、局限与建议" [level=2] [ref=e1133]
            - paragraph [ref=e1134]: 这套方案不是银弹，有几点需要考虑：
            - paragraph [ref=e1135]:
              - strong [ref=e1136]: 中继带宽是瓶颈
              - text: frps 的出口带宽直接影响租户的 SSH 体验和下载速度。建议单台中继匹配 1-2 台 GPU 服务器，避免链路拥塞。
            - paragraph [ref=e1137]:
              - strong [ref=e1138]: 电费敏感度很高
              - text: 如果机房电费超过 ¥1.0/kWh，消费级显卡的出租利润会被严重压缩。建议先用电表和你的实际电价算清楚再动手。
            - paragraph [ref=e1139]:
              - strong [ref=e1140]: 首月要有耐心
              - text: vast.ai 的新 Host 需要时间积累信誉分，第一个月的利用率和价格都不太理想。坚持 3 个月，数据会逐渐改善。
            - paragraph [ref=e1141]:
              - strong [ref=e1142]: 规模扩大的上限
              - text: 如果手上有 4 卡以上，建议考虑升级中继配置，或者采用多中继 + 负载均衡的架构。
            - separator [ref=e1143]
            - paragraph [ref=e1144]: 2026 年的 GPU 租赁市场正在经历供不应求的黄金期。高端卡交付周期排到 2027 年，AI 公司的算力需求看不到天花板。对于手上有闲置 GPU 的人来说，这是一个低门槛、高确定性的增量收入来源。
            - paragraph [ref=e1145]: 你的 GPU 每天工作几小时？剩下的时间，它本可以为你赚钱。
            - paragraph [ref=e1146]:
              - text: 或者换个问法——你买的，到底是显卡，还是一台
              - strong [ref=e1147]: 印钞机
              - text: ？
