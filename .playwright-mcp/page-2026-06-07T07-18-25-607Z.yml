            - paragraph [ref=e88]:
              - text: 2026 年 5 月，Blackwell GPU 的租赁价格两个月涨了 48%，H100 合约价半年涨了 40%。全球 AI 公司基础设施支出超过
              - strong [ref=e89]: 6000 亿美元
              - text: ，NVIDIA 削减了 40% 的游戏卡产能来供应数据中心——高端 GPU 交付周期已排到
              - strong [ref=e90]: 2027 年
              - text: 。
            - paragraph [ref=e91]:
              - text: 算力租赁市场正在经历一场供需失衡的历史级行情。中国信通院数据显示，2026 年 Q1 国内算力租赁市场规模达
              - strong [ref=e92]: 680 亿元
              - text: ，同比增长 62%。
            - paragraph [ref=e93]: 而你可能有一张 RTX 4090，每天跑 4-6 小时训练任务，剩下 18 小时在空转。电费照付，折旧照算，一分钱没收回来。
            - paragraph [ref=e94]:
              - strong [ref=e95]: 一张 RTX 4090，在 vast.ai 上出租，扣除电费和平台抽成后，每月净收入约 ¥350-600
              - text: 。如果你有 4 张卡，就是 ¥1400-2400/月。
            - paragraph [ref=e96]: 但有个现实问题：国内的 GPU 服务器连不上 vast.ai。出站被墙，入站没公网 IP。
            - paragraph [ref=e97]:
              - text: 本文提供一套
              - strong [ref=e98]: 已验证的方案
              - text: ：通过一台 ¥30/月的公网 VPS 做中继，用 FRP 建立端口隧道 + Mihomo TUN 透明代理，让内网 GPU 服务器正常注册到 vast.ai 并开始出租。两条命令，30 分钟部署。
